env-config-vars: &env-config-vars
  MODEL: Gemini 3.1 Pro (Low)

common: &common_settings
  start: agy/start.sh
  instruction_file_name: AGY.md
  gateway_sni_hosts:
    - antigravity.google
    - daily-cloudcode-pa.googleapis.com
    - cloudcode-pa.googleapis.com
    - oauth2.googleapis.com
    - www.googleapis.com

gemini-default:
